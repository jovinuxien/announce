spring:
  application:
    name: announce-management
  banner:
    location: classpath:/banner.txt
    charset: UTF-8
  cloud:
    loadbalancer:
      ribbon:
        enabled: true
    config:
      enabled: false
    function:
      definition: orderEvents                       # subscriber beans (AnnounceMessaging)
    stream:
      bindings:
        announce-out-0:
          destination: announce.v1                  # the public topic of this service (PublicEventRelay announce-public)
        orderEvents-in-0:
          destination: order.v1                     # marks announces SOLD / relists them from the order module's events
          group: announce-management
      kafka:
        binder:
          brokers: ${ANNOUNCE_KAFKA_BROKERS:localhost:9094}
          auto-create-topics: true
          replication-factor: 1
  profiles:
    #active: db, core, elastic, admin, wx
    active: dev
  messages:
    encoding: UTF-8
#  servlet:
#    context-path: /
#    multipart:
#      max-file-size: 20MB
#      max-request-size: 20MB
  cjdropship:
    api:
      auth:
        cj-email: "bimeni89@gmail.com"
        cj-apiKey: "8696a1e060b64e1ab99e3f16cac7a87a"
        access-url: "https://developers.cjdropshipping.com/api2.0/v1/authentication/getAccessToken"
        refresh-url: "https://developers.cjdropshipping.com/api2.0/v1/authentication/refreshAccessToken"
      category:
        category-list-_url: "https://developers.cjdropshipping.com/api2.0/v1/product/getCategory"
      product:
        list-url: "https://developers.cjdropshipping.com/api2.0/v1/product/list"
        product-detail-url: "https://developers.cjdropshipping.com/api2.0/v1/product"
  # announce_reactive_db through reactive-mybatis-support (it builds the pooled ConnectionFactory that
  # Spring Data R2DBC also uses). Override with the ANNOUNCE_* environment variables.
  r2dbc:
    mybatis:
      r2dbc-url: ${ANNOUNCE_R2DBC_URL:r2dbc:mysql://localhost:3306/announce_reactive_db}
      username: ${ANNOUNCE_DB_USER:announce}
      password: ${ANNOUNCE_DB_PASSWORD:Calliste_1006}
      pool:
        initial-size: 2
        max-size: 20
  data:
    r2dbc:
      repositories:
        enabled: true


server:
  port: 8085
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain


eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


# reactive-mybatis-support: where the announce_* mapper XML lives (db-reactive jar)
r2dbc:
  mybatis:
    mapper-locations: classpath:org/linlinjava/announce/db/dao/reactive/*.xml
    configuration:
      map-underscore-to-camel-case: true

# Command side: the Announce aggregate lives in EventSourcingDB under /announce/{id} (docker/cqrs/docker-compose.yml)
esdb:
  server:
    uri: ${ANNOUNCE_ESDB_URI:http://localhost:3000}
    api-token: ${ANNOUNCE_ESDB_TOKEN:secret}

# Read side: the two projection groups of this service (checkpoints in cqrs_readside_progress, same database)
opencqrs:
  event-handling:
    standard:
      fetch:
        subject: /announce
        recursive: true
      retry:
        policy: exponential_backoff
        initial-interval: 500ms
        max-interval: 30s
        max-elapsed-time: 1h
      life-cycle:
        controller: application_context
    groups:
      announce-read-model: {}
      announce-search: {}
      announce-public: {}

cqrs:
  readside:
    handler-timeout: 30s
    progress:
      tracker: r2dbc
  command:
    idempotency:
      enabled: true
  api:
    clients:
      ocs-indexer:
        base-url: ${ANNOUNCE_OCS_INDEXER_URL:http://localhost:8535}

announce:
  # The site trades in one currency; public events carry it next to prices in minor units
  currency: DKK
  # Announces expire automatically (see AnnounceExpiryJob)
  expiry:
    enabled: true
    cron: "0 */15 * * * *"
  # Announces and crawled listings share one OCS index: mode ocs pushes to the indexer, mode noop records in memory
  search:
    mode: ocs
    index: announce_index
  # Crawled listings (dba.dk, tradera.com): feed files polled from import.dir (Spring Integration), stale rows swept
  listing:
    gone-after: P7D
    import:
      enabled: true
      dir: ${ANNOUNCE_LISTING_IMPORT_DIR:/home/bimeni/announce_crawled_data}
      poll: PT1M
    sweep:
      enabled: true
      cron: "0 30 * * * *"
    reindex:
      batch: 500

logging:
  level:
    root: INFO
    #org.springframework.web: DEBUG
    #org.linlinjava.announce:
  config: classpath:logback-spring.xml

swagger:
  production: false