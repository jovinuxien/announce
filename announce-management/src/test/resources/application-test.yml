# Profile "test": the container-backed suite. Connections (EventSourcingDB, MySQL) come from @DynamicPropertySource.
spring:
  main:
    banner-mode: off
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    stream:
      kafka:
        binder:
          brokers: localhost:9092      # no topic is used by this service yet; the binder stays idle
eureka:
  client:
    enabled: false
management:
  health:
    binders:
      enabled: false

opencqrs:
  event-handling:
    standard:
      retry:
        policy: exponential_backoff
        initial-interval: 200ms
        max-interval: 2s
        max-attempts: 30

cqrs:
  readside:
    handler-timeout: 15s

announce:
  expiry:
    enabled: false
  search:
    mode: noop             # RecordingSearchIndexer stands in for the OCS client and remembers every call
  listing:
    import:
      enabled: false       # the end-to-end test enables the polling flow itself with a temporary directory
    sweep:
      enabled: false

logging:
  level:
    org.linlinjava.announce: INFO
    org.linlinjava.announce.cqrs: DEBUG
