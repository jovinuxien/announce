# Profile "test": the container-backed suite. Connections (EventSourcingDB, MySQL) come from @DynamicPropertySource.
spring:
  main:
    banner-mode: off
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    function:
      definition: orderEvents;announceProbe          # the service's subscriber plus the test's probe of announce.v1
    stream:
      bindings:
        announceProbe-in-0:
          destination: announce.v1
          group: announce-management-test
      kafka:
        binder:
          brokers: localhost:9092      # replaced by the Kafka container through @DynamicPropertySource
          auto-create-topics: true
          replication-factor: 1
eureka:
  client:
    enabled: false
management:
  health:
    binders:
      enabled: false

opencqrs:
  event-handling:
    standard:
      retry:
        policy: exponential_backoff
        initial-interval: 200ms
        max-interval: 2s
        max-attempts: 30

cqrs:
  readside:
    handler-timeout: 15s

announce:
  service-token:
    mode: "off"            # the suites call the controllers directly; AnnounceKindsEndToEndTest turns enforce on
  expiry:
    enabled: false
  search:
    mode: noop             # RecordingSearchIndexer stands in for the OCS client and remembers every call
  listing:
    import:
      enabled: false       # the end-to-end test enables the polling flow itself with a temporary directory
    sweep:
      enabled: false

logging:
  level:
    org.linlinjava.announce: INFO
    org.linlinjava.announce.goods.infrastructure.projection: DEBUG
    org.linlinjava.announce.cqrs: DEBUG
