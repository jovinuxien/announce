version: '3'
services:
  mysql57:
    image: mysql:5.7
    container_name: mysql
    ports:
      - "3306:3306"
    command:
      --character-set-server=utf8
      --collation-server=utf8_general_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - ./db/conf.d:/etc/mysql/conf.d
      - ./db/data:/var/lib/mysql
      - ./db/init-sql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: litemall123456
    restart: always
  litemall:
    build:
      context: litemall
      dockerfile: Dockerfile
    container_name: litemall
    ports:
      - "8080:8080"
    volumes:
      - ./litemall/storage:/storage
      - ./litemall/logs:/logs
      - ./litemall/backup:/backup
      - /etc/localtime:/etc/localtime
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - mysql57
    restart: always
  # Customer edge (Spring Cloud Gateway + React SPA, module gateway-api). Build the jar first:
  #   mvn -pl gateway-api -P webapp -DskipTests package
  # Publishes 8080 like the legacy litemall container above: run one of the two, or map another host port.
  gateway-api:
    image: eclipse-temurin:21-jre
    container_name: announce_gateway_api
    working_dir: /app
    command: ["java", "-jar", "/app/gateway-api.jar"]
    volumes:
      - ../gateway-api/target/gateway-api-0.0.1-SNAPSHOT.jar:/app/gateway-api.jar:ro
    ports:
      - "8080:8080"
    environment:
      ANNOUNCE_R2DBC_URL: r2dbc:mysql://host.docker.internal:3306/announce_reactive_db
      ANNOUNCE_EUREKA_URL: http://host.docker.internal:8761/eureka/
      ANNOUNCE_CONFIG_URL: http://host.docker.internal:8888
      ANNOUNCE_SEARCHER_URL: http://host.docker.internal:8534
      ANNOUNCE_SUGGEST_URL: http://host.docker.internal:8536
      # shared with gateway-admin and the backends (announce.service-token.secret): they answer 401 otherwise
      ANNOUNCE_SERVICE_SECRET: ${ANNOUNCE_SERVICE_SECRET:-dev-service-secret-change-me}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Staff edge (doc/frontend-edges.md): gateway + admin SPA on 8081. Build the jar with the SPA first:
  #   mvn -pl gateway-admin -P webapp -DskipTests package
  # The prod profile refuses to start without real signing keys; the machine secret must match the backends.
  gateway-admin:
    build:
      context: ../gateway-admin
      dockerfile: Dockerfile
    container_name: announce-gateway-admin
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - ANNOUNCE_R2DBC_URL=r2dbc:mysql://mysql57:3306/announce_reactive_db
      - ANNOUNCE_DB_USER=announce
      - ANNOUNCE_DB_PASSWORD=${ANNOUNCE_DB_PASSWORD:?set ANNOUNCE_DB_PASSWORD}
      - ANNOUNCE_ADMIN_JWT_PRIVATE_KEY_PEM=${ANNOUNCE_ADMIN_JWT_PRIVATE_KEY_PEM:?set the PKCS#8 private key PEM}
      - ANNOUNCE_ADMIN_JWT_PUBLIC_KEY_PEM=${ANNOUNCE_ADMIN_JWT_PUBLIC_KEY_PEM:?set the X.509 public key PEM}
      - ANNOUNCE_SERVICE_SECRET=${ANNOUNCE_SERVICE_SECRET:?set the shared machine secret}
      - ANNOUNCE_ROUTES_ANNOUNCE_MANAGEMENT=http://announce-management:8085
      - ANNOUNCE_ROUTES_MESSAGING=http://messaging:8086
      - ANNOUNCE_ROUTES_ORDER=http://order:8087
    depends_on:
      - mysql57
    restart: always
