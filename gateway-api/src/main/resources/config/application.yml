spring:
  application:
    name: gateway-api
  # Optional config server (same as the other modules); the edge starts without it.
  config:
    import: "optional:configserver:${ANNOUNCE_CONFIG_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:9000"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
          # Explicit routes only, matched in this order, no StripPrefix (backends keep their /api paths).
          # Every target is a property so tests can point a route at a MockWebServer.
          routes:
            # announce-management: catalog reads are public, writes need a member (see security.PublicPaths);
            # SellerHeader copies the trusted X-User-Id into X-Seller-Id, the owner header that module reads today.
            - id: announce-management
              uri: ${announce.routes.announce-management:lb://announce-management}
              predicates:
                - Path=/api/announces/**,/api/categories/**,/api/brands/**
              filters:
                - SellerHeader
              metadata:
                serviceToken: true
            # click-out of a crawled listing: 302 to the source page
            - id: click-out
              uri: ${announce.routes.announce-management:lb://announce-management}
              predicates:
                - Path=/out/**
              metadata:
                serviceToken: true
            # OCS search tier (docker/cqrs): fixed URLs, path rewritten to the tenant API
            - id: search
              uri: ${announce.search.searcher-url}
              predicates:
                - Path=/api/search
              filters:
                - SetPath=/search-api/v1/search/${announce.search.index}
            - id: suggest
              uri: ${announce.search.suggest-url}
              predicates:
                - Path=/api/suggest
              filters:
                - SetPath=/suggest-api/v1/${announce.search.index}/suggest
            # order module: auctions, orders, seller accounts (member) and provider webhooks (public, provider-signed)
            - id: order
              uri: ${announce.routes.order:lb://order}
              predicates:
                - Path=/api/auctions/**,/api/orders/**,/api/sellers/**,/api/payments/webhook/**,/api/shipping/webhook/**
              metadata:
                serviceToken: true
            # messaging: REST fallback and the WebSocket (token as access_token query parameter at handshake)
            - id: messaging
              uri: ${announce.routes.messaging:lb://messaging}
              predicates:
                - Path=/api/conversations/**
              metadata:
                serviceToken: true
            - id: messaging-ws
              uri: ${announce.routes.messaging-ws:lb:ws://messaging}
              predicates:
                - Path=/ws/conversations/**
              metadata:
                serviceToken: true
  # announce_reactive_db through reactive-mybatis-support (announce_user, announce_refresh_token)
  r2dbc:
    mybatis:
      r2dbc-url: ${ANNOUNCE_R2DBC_URL:r2dbc:mysql://localhost:3306/announce_reactive_db}
      username: ${ANNOUNCE_DB_USER:announce}
      password: ${ANNOUNCE_DB_PASSWORD:Calliste_1006}
      pool:
        initial-size: 1
        max-size: 10

r2dbc:
  mybatis:
    mapper-locations: classpath:org/linlinjava/announce/db/dao/reactive/*.xml
    configuration:
      map-underscore-to-camel-case: true

server:
  port: 8080
  compression:
    enabled: true

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${ANNOUNCE_EUREKA_URL:http://localhost:8761/eureka/}

announce:
  search:
    index: announce_index
    searcher-url: ${ANNOUNCE_SEARCHER_URL:http://localhost:8534}
    suggest-url: ${ANNOUNCE_SUGGEST_URL:http://localhost:8536}
  routes:
    announce-management: lb://announce-management
    order: lb://order
    messaging: lb://messaging
    messaging-ws: lb:ws://messaging
  auth:
    # the refresh cookie is httpOnly and scoped to /auth; Secure is off for plain-http local development
    cookie-name: announce_refresh
    cookie-secure: ${ANNOUNCE_AUTH_COOKIE_SECURE:false}
    refresh-ttl: 30d
  machine:
    # X-Service-Token = v1.<service>.<epochSeconds>.<hmacSha256(service:epochSeconds)> on routes with metadata serviceToken
    service: gateway-api
    secret: ${ANNOUNCE_MACHINE_SECRET:announce-dev-machine-secret}
  jwt:
    issuer: announce-customer
    audience: announce-customer-api
    access-ttl: 2h
