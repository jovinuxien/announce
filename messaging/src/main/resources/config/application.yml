spring:
  application:
    name: messaging
  cloud:
    config:
      enabled: false
    function:
      # the Spring Cloud Stream consumers of this service (see infrastructure.messaging)
      definition: orderEvents;liveEvents
    stream:
      bindings:
        # public events of this service (PublicEventRelay group messaging-public)
        messaging-out-0:
          destination: messaging.v1
        # live fan-out of conversation events to every node holding WebSocket sessions (group messaging-live)
        messaging-live-out-0:
          destination: messaging.live
        # the order context: SYSTEM messages into the listing conversation (agreed, paid, shipped, settled)
        orderEvents-in-0:
          destination: order.v1
          group: messaging
        # every node reads the whole live topic from its own consumer group and pushes to its local sockets; the
        # group is named after the node (stable across restarts, no dead group left behind) and reset to the latest
        # offset at every start, since a socket only ever sees what happens after it attached
        liveEvents-in-0:
          destination: messaging.live
          group: messaging-live-${ANNOUNCE_NODE:${HOSTNAME:node}-${server.port}}
      kafka:
        binder:
          brokers: ${ANNOUNCE_KAFKA_BROKERS:localhost:9094}
          auto-create-topics: true
          replication-factor: 1
        bindings:
          # the live topic is tuned for latency, not durability: a lost live record only costs a push the client
          # recovers with GET .../messages?after= (tuning step 4 of doc/messaging-architecture.md)
          messaging-live-out-0:
            producer:
              configuration:
                linger.ms: 0              # send each record at once, never wait to fill a batch
                acks: "1"                 # the leader's write is enough; no wait for replicas
                enable.idempotence: false # the sequence bookkeeping of the idempotent producer needs acks=all
                compression.type: none    # a 300-byte record is not worth compressing
          liveEvents-in-0:
            consumer:
              start-offset: latest
              reset-offsets: true         # seek to the end at every start even though the group has an offset
              configuration:
                fetch.min.bytes: 1        # the broker answers a fetch as soon as one record is there
                fetch.max.wait.ms: 100    # and waits at most this long for one when the topic is quiet
                max.poll.records: 100     # a poll that returns a burst still hands records over in small batches
  # announce_reactive_db through reactive-mybatis-support (it builds the pooled ConnectionFactory that
  # Spring Data R2DBC and the cqrs-reactive tables also use). Override with the ANNOUNCE_* environment variables.
  r2dbc:
    mybatis:
      r2dbc-url: ${ANNOUNCE_R2DBC_URL:r2dbc:mysql://localhost:3306/announce_reactive_db}
      username: ${ANNOUNCE_DB_USER:announce}
      password: ${ANNOUNCE_DB_PASSWORD:Calliste_1006}
      pool:
        initial-size: 2
        # processor threads (3 groups, 4 partitions for the read model = 6) x 2 statements in flight, the binder
        # consumers, the lock heartbeats and the request concurrency; 20 was tight once the read model was partitioned
        max-size: 40

server:
  port: 8086

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# reactive-mybatis-support: where the announce_* mapper XML lives (db-reactive jar)
r2dbc:
  mybatis:
    mapper-locations: classpath:org/linlinjava/announce/db/dao/reactive/*.xml
    configuration:
      map-underscore-to-camel-case: true

# Command side: the Conversation aggregate lives in EventSourcingDB under /conversation/{id}
esdb:
  server:
    uri: ${ANNOUNCE_ESDB_URI:http://localhost:3000}
    api-token: ${ANNOUNCE_ESDB_TOKEN:secret}

# Command side: the state of a conversation is kept in an LRU cache keyed by subject, so a command replays only
# the events written after the cached state instead of the whole conversation (the cache stores the id of the
# last event it saw and the router always reads what came after it from EventSourcingDB, so a stale entry on one
# node is harmless). Capacity = conversations kept per node; one entry grows by about 150 bytes per message.
# Read side: the projection groups of this service (checkpoints in cqrs_readside_progress, same database).
# life-cycle.controller=leader_election: every group and partition runs on exactly one node at a time, elected
# through the lock table cqrs_readside_lock (cqrs.readside.leader-election below); with application_context every
# node would run every processor and the live topic would carry one copy of each record per node.
# conversation-read-model has 4 partitions: ordering is only needed per conversation (sequence resolution
# per_second_level_subject), so four processor threads project four conversations at once; the relays keep one
# partition each (one Kafka send per event is not the bottleneck). Changing the partition count is an
# administrative step: stop every node first (cqrs.readside.progress.seed-partitions fills the new checkpoints).
opencqrs:
  command-handling:
    cache:
      type: in_memory
      capacity: 1000
  event-handling:
    standard:
      fetch:
        subject: /conversation
        recursive: true
      retry:
        policy: exponential_backoff
        initial-interval: 500ms
        max-interval: 30s
        max-elapsed-time: 1h
      life-cycle:
        controller: leader_election
    groups:
      conversation-read-model:
        life-cycle:
          partitions: 4
      messaging-public: {}
      messaging-live: {}

# Only requests that passed an edge are served: gateway-api and gateway-admin sign each proxied request with
# X-Service-Token (HMAC over this shared secret); anything else gets 401, so the identity headers can be trusted.
# To call this service directly during development, start it with --announce.service-token.mode=off (or log).
announce:
  service-token:
    mode: enforce
    secret: ${ANNOUNCE_SERVICE_SECRET:dev-service-secret-change-me}

cqrs:
  readside:
    handler-timeout: 30s
    progress:
      tracker: r2dbc
      seed-partitions: true
    # one active copy of each processor across nodes: lease of 10 s renewed every 500 ms (the initiator's heartbeat),
    # a node that does not hold a group asks again every 250 ms; a crashed node loses its groups within the lease
    leader-election:
      enabled: true
      table: cqrs_readside_lock
      ttl: 10s
      poll-interval: 250ms
  command:
    idempotency:
      enabled: true
  api:
    clients:
      # the announce API answers who owns an announce when a listing conversation is opened
      announce-management:
        base-url: ${ANNOUNCE_MANAGEMENT_URL:http://localhost:8085}
        service-token: true      # announce-management only answers callers that hold the shared secret

messaging:
  # a TEXT message may hold this many characters
  max-text-length: 4000
  # how many messages one history page returns at most
  max-page-size: 200
  # two commands racing on one conversation: the one the event store refused is dispatched again on the new state
  command-retry:
    max-retries: 3
    min-backoff: 5ms
    max-backoff: 50ms
  # socket handshake: a conversation the read model does not know yet is looked up again before the socket is refused
  attach:
    rechecks: 5
    recheck-interval: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      # which node a sample comes from; set ANNOUNCE_NODE when several nodes run on one host
      node: ${ANNOUNCE_NODE:${server.port}}
    # p50/p95/p99 of the messaging.* timers: see infrastructure.metrics.MessagingMetricsConfig

logging:
  level:
    root: INFO
    org.linlinjava.announce: INFO
