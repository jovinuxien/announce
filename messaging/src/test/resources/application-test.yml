# Profile "test": EventSourcingDB and Kafka come from Testcontainers (@DynamicPropertySource); the read model is the
# live announce_reactive_db on localhost:3306 (see MessagingEndToEndTest, which removes the rows it created).
spring:
  main:
    banner-mode: off
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    function:
      definition: orderEvents;liveEvents;publicEventsProbe
    stream:
      bindings:
        publicEventsProbe-in-0:
          destination: messaging.v1
          group: messaging-test-probe
      kafka:
        binder:
          auto-create-topics: true
          replication-factor: 1
        bindings:
          liveEvents-in-0:
            consumer:
              start-offset: latest
eureka:
  client:
    enabled: false
management:
  health:
    binders:
      enabled: false

opencqrs:
  command-handling:
    cache:
      type: in_memory     # as in production; MessagingEndToEndTest asserts the router holds the LRU cache
      capacity: 1000
  event-handling:
    standard:
      retry:
        policy: exponential_backoff
        initial-interval: 200ms
        max-interval: 2s
        max-attempts: 30
      life-cycle:
        controller: leader_election    # as in production; MessagingEndToEndTest asserts the controllers and the leases
    groups:
      conversation-read-model:
        life-cycle:
          partitions: 2                # the suite runs a partitioned projection; order per conversation must hold

announce:
  service-token:
    mode: "off"         # suites call the controllers directly; the end-to-end test turns enforce on

messaging:
  socket:
    buffer-frames: 64   # small so MessagingEndToEndTest overflows a stalled socket with a few thousand frames
    ping-interval: 1s   # and short so a client that answers no ping is closed within the suite's patience
    idle-timeout: 4s
    write-timeout: 10s

cqrs:
  readside:
    handler-timeout: 15s
    leader-election:
      enabled: true
      table: cqrs_readside_lock_test   # not the table of a node running on the same database (its leases would block the suite)
  api:
    clients:
      announce-management:
        base-url: http://localhost:1     # never called: the test supplies a stub AnnounceLookup

logging:
  level:
    org.linlinjava.announce: INFO
    org.linlinjava.announce.cqrs: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
